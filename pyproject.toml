[tool.pytest.ini_options]
testpaths = ["services/brain/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "node_modules", ".cache", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["services/brain/tests", ".venv", "node_modules"]
